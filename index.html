<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Profissional - WhatsApp Marketing</title>
    <style>
      :root { --primary: #075e54; --secondary: #128c7e; --light: #f4f7f6; --accent: #25d366; }
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); margin: 0; padding: 20px; color: #333; }
      .wrapper { max-width: 800px; margin: auto; }
      .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }
      h2 { color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--light); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
      label { font-weight: 600; display: block; margin-top: 15px; color: var(--secondary); font-size: 14px; }
      input, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
      button { background-color: var(--accent); color: white; border: none; padding: 14px; width: 100%; margin-top: 25px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
      button:hover { background-color: #1ebe5d; }
      .campanha-item { background: #f8f9fa; border-left: 5px solid var(--accent); padding: 18px; margin-top: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.04); }
      .acoes { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
      .acoes button { flex: 1; margin-top: 0; padding: 10px; font-size: 14px; }
      .btn-copiar { background-color: #34b7f1; }
      .btn-enviar { background-color: var(--primary); }
      .tag { background: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="wrapper">
      
      <div class="card">
        <h2>🚀 Nova Campanha <span class="tag">Vercel + Google Sheets</span></h2>
        
        <form id="formCampanha">
          <label>Nome da Campanha:</label>
          <input type="text" id="nomeCampanha" value="Anny Óptica — Web e Tráfego" required>

          <label>Destinatário (Telefone com DDD ou Link do Grupo):</label>
          <input type="text" id="destino" value="5584921466248" required>

          <label>Texto da Mensagem:</label>
          <textarea id="mensagem" rows="4" placeholder="Digite sua mensagem..." required></textarea>

          <label>Anexar Imagens / Criativos (Opcional):</label>
          <input type="file" id="imagens" accept="image/*" multiple>

          <label>Data e Hora Programada:</label>
          <input type="datetime-local" id="dataHora" required>

          <button type="button" id="btnSalvar" onclick="executarAgendamento()">Programar Campanha</button>
        </form>
        <div id="statusMsg" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
      </div>

      <div class="card">
        <h2>📅 Fila de Campanhas <button onclick="carregarFila()" style="width: auto; padding: 8px 15px; font-size: 13px; margin: 0; background: #34b7f1;">🔄 Atualizar Fila</button></h2>
        <div id="filaContainer">
          <p style="text-align: center; color: #666;">Carregando campanhas...</p>
        </div>
      </div>

    </div>

    <script>
      // URL do seu Web App do Google Apps Script atualizada
      const urlAPI = "https://script.google.com/macros/s/AKfycbz1LzkjbEKAUR1w5YXfOSYzp3qqYoEHjcIBqexnS1yY6RWhcif-XSlLWrw-WA4kvdJr2g/exec";

      async function executarAgendamento() {
        var nome = document.getElementById('nomeCampanha').value;
        var destino = document.getElementById('destino').value;
        var mensagem = document.getElementById('mensagem').value;
        var inputImagens = document.getElementById('imagens');
        var dataHora = document.getElementById('dataHora').value;
        var btn = document.getElementById('btnSalvar');
        var status = document.getElementById('statusMsg');

        if(!nome || !destino || !mensagem || !dataHora) {
          alert('Preencha os campos obrigatórios.');
          return;
        }

        btn.disabled = true;
        btn.innerText = 'Salvando no Google Sheets...';
        status.style.color = '#075e54';
        status.innerText = 'Processando dados e imagens...';

        try {
          var imagensBase64 = [];
          if (inputImagens.files.length > 0) {
            for (var i = 0; i < inputImagens.files.length; i++) {
              var f = inputImagens.files[i];
              var b64 = await fileToBase64(f);
              imagensBase64.push({
                nome: f.name,
                mimeType: f.type,
                bytes: b64.split(',')[1]
              });
            }
          }

          var payload = {
            acao: 'salvarCampanha',
            nomeCampanha: nome,
            destino: destino,
            mensagem: mensagem,
            imagensBase64: imagensBase64,
            dataHora: dataHora
          };

          let response = await fetch(urlAPI, {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          let resultado = await response.json();

          if (resultado.sucesso) {
            status.style.color = 'green';
            status.innerText = resultado.mensagem;
            document.getElementById('formCampanha').reset();
            carregarFila();
          } else {
            status.style.color = 'red';
            status.innerText = 'Erro: ' + resultado.erro;
          }

        } catch (err) {
          status.style.color = 'red';
          status.innerText = 'Erro de conexão: ' + err;
        }

        btn.disabled = false;
        btn.innerText = 'Programar Campanha';
        setTimeout(() => status.innerText = '', 4000);
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = err => reject(err);
        });
      }

      async function carregarFila() {
        var container = document.getElementById('filaContainer');
        container.innerHTML = '<p style="text-align:center; color:#666;">Carregando...</p>';

        try {
          let response = await fetch(urlAPI + '?acao=obterFila');
          let lista = await response.json();

          container.innerHTML = '';
          if (!lista || lista.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#666;">Nenhuma campanha pendente na fila.</p>';
            return;
          }

          lista.forEach(function(item) {
            var div = document.createElement('div');
            div.className = 'campanha-item';

            var fotosHtml = '';
            if (item.imagens) {
              var links = item.imagens.split(' | ');
              fotosHtml = '<div style="margin: 8px 0;"><strong>Mídias:</strong> ';
              links.forEach((link, index) => {
                fotosHtml += `<a href="${link}" target="_blank" style="color: #0288d1; margin-right: 10px;">[Ver Foto ${index+1}]</a>`;
              });
              fotosHtml += '</div>';
            }

            div.innerHTML = `
              <strong>📢 ${item.nomeCampanha}</strong><br>
              <small style="color: #555;">Agendado para: <b>${item.dataHora}</b> | Destino: ${item.destino}</small><br>
              <p style="margin: 6px 0; background: white; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">${item.mensagem}</p>
              ${fotosHtml}
              
              <div class="acoes">
                <button class="btn-copiar" onclick="copiarTexto('${encodeURIComponent(item.mensagem)}')">📋 Copiar Mensagem</button>
                <button class="btn-enviar" onclick="dispararCampanha('${item.destino}', '${encodeURIComponent(item.mensagem)}', ${item.linha})">🚀 Abrir & Disparar</button>
              </div>
            `;
            container.appendChild(div);
          });
        } catch (err) {
          container.innerHTML = '<p style="text-align:center; color:red;">Erro ao carregar a fila.</p>';
        }
      }

      function copiarTexto(textoCodificado) {
        navigator.clipboard.writeText(decodeURIComponent(textoCodificado)).then(() => {
          alert('Mensagem copiada para a área de transferência!');
        });
      }

      async function dispararCampanha(destino, textoCodificado, linha) {
        var url = '';
        if (destino.includes('chat.whatsapp.com')) {
          url = destino;
        } else {
          var num = destino.replace(/\D/g, '');
          url = 'https://api.whatsapp.com/send?phone=' + num + '&text=' + textoCodificado;
        }

        window.open(url, '_blank');

        await fetch(urlAPI, {
          method: 'POST',
          body: JSON.stringify({ acao: 'concluirCampanha', linha: linha })
        });

        carregarFila();
      }

      window.onload = carregarFila;
    </script>
</body>
</html>
