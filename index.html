<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Disparador WhatsApp</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; margin: 0; padding: 20px; }
      .container { max-width: 600px; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin: auto; }
      h2 { color: #075e54; margin-top: 0; text-align: center; }
      label { font-weight: bold; display: block; margin-top: 12px; color: #128c7e; }
      input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
      button { background-color: #25d366; color: white; border: none; padding: 12px; width: 100%; margin-top: 18px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
      button:hover { background-color: #1ebe5d; }
      .card-pendente { background: #f0f2f5; border-left: 5px solid #25d366; padding: 15px; margin-top: 15px; border-radius: 5px; }
      .btn-disparar { background-color: #075e54; margin-top: 8px; }
      .btn-copiar { background-color: #34b7f1; margin-top: 6px; }
      .btn-foto { background-color: #128c7e; margin-top: 6px; text-decoration: none; display: inline-block; padding: 8px 12px; color: white; border-radius: 4px; text-align: center; font-size: 14px; }
      hr { margin: 25px 0; border: 0; border-top: 1px solid #ddd; }
      .botoes-acao { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .botoes-acao button { flex: 1; min-width: 140px; }
      .fotos-container { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Agendar Disparo WhatsApp</h2>
      
      <form id="formAgendamento">
        <label>Nome da Conversa/Grupo:</label>
        <input type="text" id="nome" value="Anny Óptica — Web e Tráfego" required>

        <label>Telefone (apenas números com DDD) ou Link do Grupo:</label>
        <input type="text" id="destino" placeholder="Ex: https://chat.whatsapp.com/... ou 5584921466248" value="5584921466248" required>

        <label>Texto da Mensagem:</label>
        <textarea id="mensagem" rows="3" placeholder="Digite sua mensagem aqui..." required></textarea>

        <label>Subir Imagens/Fotos (Opcional):</label>
        <input type="file" id="fotos" accept="image/*" multiple>

        <label>Data e Hora do Disparo:</label>
        <input type="datetime-local" id="dataHora" required>

        <button type="button" id="btnSalvar" onclick="enviarFormulario()">Agendar e Processar Fotos</button>
      </form>
      
      <div id="statusForm" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>

      <hr>

      <h2>Disparos Agendados / Prontos</h2>
      <button onclick="carregarPendentes()" style="background-color: #34b7f1; margin-top:0;">Atualizar Lista de Disparos</button>
      <div id="listaPendentes"></div>
    </div>

    <script>
      async function enviarFormulario() {
        var nome = document.getElementById('nome').value;
        var destino = document.getElementById('destino').value;
        var mensagem = document.getElementById('mensagem').value;
        var inputFotos = document.getElementById('fotos');
        var dataHora = document.getElementById('dataHora').value;
        var btnSalvar = document.getElementById('btnSalvar');
        var statusDiv = document.getElementById('statusForm');

        if(!nome || !destino || !mensagem || !dataHora) {
          alert('Preencha os campos obrigatórios!');
          return;
        }

        btnSalvar.disabled = true;
        btnSalvar.innerText = 'Enviando... Aguarde...';
        statusDiv.style.color = '#075e54';
        statusDiv.innerText = 'Processando dados e arquivos...';

        try {
          var arquivosBase64 = [];
          if (inputFotos.files.length > 0) {
            for (var i = 0; i < inputFotos.files.length; i++) {
              var file = inputFotos.files[i];
              var base64 = await converterParaBase64(file);
              arquivosBase64.push({
                nome: file.name,
                mimeType: file.type,
                bytes: base64.split(',')[1]
              });
            }
          }

          google.script.run
            .withSuccessHandler(function(resposta) {
              statusDiv.style.color = 'green';
              statusDiv.innerText = resposta;
              document.getElementById('formAgendamento').reset();
              document.getElementById('nome').value = 'Anny Óptica — Web e Tráfego';
              document.getElementById('destino').value = '5584921466248';
              btnSalvar.disabled = false;
              btnSalvar.innerText = 'Agendar e Processar Fotos';
              carregarPendentes();
              setTimeout(() => statusDiv.innerText = '', 4000);
            })
            .withFailureHandler(function(erro) {
              statusDiv.style.color = 'red';
              statusDiv.innerText = 'Erro: ' + erro.message;
              btnSalvar.disabled = false;
              btnSalvar.innerText = 'Agendar e Processar Fotos';
            })
            .salvarAgendamentoComUpload(nome, destino, mensagem, arquivosBase64, dataHora);

        } catch (err) {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'Erro ao processar imagem: ' + err.message;
          btnSalvar.disabled = false;
          btnSalvar.innerText = 'Agendar e Processar Fotos';
        }
      }

      function converterParaBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
        });
      }

      function carregarPendentes() {
        google.script.run.withSuccessHandler(function(lista) {
          var container = document.getElementById('listaPendentes');
          container.innerHTML = '';

          if (lista.length === 0) {
            container.innerHTML = '<p style="text-align:center;">Nenhum disparo pendente no momento.</p>';
            return;
          }

          lista.forEach(function(item) {
            var card = document.createElement('div');
            card.className = 'card-pendente';

            var linksHtml = '';
            if (item.linkFoto) {
              var links = item.linkFoto.split(' | ');
              linksHtml = '<div class="fotos-container"><strong>Fotos enviadas:</strong><br>';
              links.forEach(function(url, idx) {
                linksHtml += `<a class="btn-foto" href="${url}" target="_blank">🖼️ Abrir Foto ${idx + 1}</a> `;
              });
              linksHtml += '</div>';
            }

            card.innerHTML = `
              <strong>Destino:</strong> ${item.nome}<br>
              <strong>Mensagem:</strong> ${item.mensagem}<br>
              ${linksHtml}
              
              <div class="botoes-acao">
                <button class="btn-copiar" onclick="copiarTexto('${encodeURIComponent(item.mensagem)}')">📋 1. Copiar Texto</button>
                <button class="btn-disparar" onclick="abrirEConcluir('${item.destino}', '${encodeURIComponent(item.mensagem)}', ${item.linha})">🚀 2. Abrir Grupo / Chat</button>
              </div>
            `;
            container.appendChild(card);
          });
        }).obterAgendamentosProntos();
      }

      function copiarTexto(textoCodificado) {
        var texto = decodeURIComponent(textoCodificado);
        navigator.clipboard.writeText(texto).then(function() {
          alert('Texto copiado com sucesso! Agora é só colar (Ctrl+V) no WhatsApp.');
        });
      }

      function abrirEConcluir(destino, textoCodificado, linha) {
        var url = '';
        if (destino.includes('chat.whatsapp.com')) {
          url = destino;
        } else {
          var num = destino.replace(/\Dg/g, '');
          url = 'https://api.whatsapp.com/send?phone=' + num + '&text=' + textoCodificado;
        }
        
        window.open(url, '_blank');

        google.script.run.withSuccessHandler(function() {
          carregarPendentes();
        }).marcarComoEnviado(linha);
      }

      window.onload = carregarPendentes;
    </script>
  </body>
</html>
